<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="dashboard">

    <header>
        <h1>Admin Dashboard</h1>
        <p>Submitted User Information</p>
    </header>

    <main>

        <div class="card">
            <h2>User Submissions</h2>

            <table>
                <thead>
                   <tr>
    <th>#</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Residential Address</th>
    <th>Nearest Airport</th>
    
    <th>Date</th>
</tr>
                </thead>

                <tbody id="submissions">
                    <tr>
                        <td colspan="5">Loading...</td>
                    </tr>
                </tbody>
            </table>

        </div>

    </main>

</div>

<script>
    async function loadSubmissions() {

        try {
            const response = await fetch("/submissions");

            if (!response.ok) {
                throw new Error("Server returned an error");
            }

            const data = await response.json();

            const table = document.getElementById("submissions");

            table.innerHTML = "";

            if (data.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="5">No submissions yet.</td>
                    </tr>
                `;
                return;
            }

            data.forEach((user, index) => {

                const row = document.createElement("tr");

               row.innerHTML = `
    <td>${index + 1}</td>
    <td>${user.name}</td>
    <td>${user.email}</td>
    <td>${user.phone || ""}</td>
    <td>${user.address || ""}</td>
    <td>${user.airport || ""}</td>
    
    <td>${user.date || ""}</td>
`;

                table.appendChild(row);
            });

        } catch (error) {

            console.error("Could not load submissions:", error);

            document.getElementById("submissions").innerHTML = `
                <tr>
                    <td colspan="8">Error loading submissions.</td>
                </tr>
            `;
        }
    }

    // Load submissions when page opens
    loadSubmissions();

    // Check for new submissions every 5 seconds
    setInterval(loadSubmissions, 5000);
</script>
```

</body>
</html>
