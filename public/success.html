<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submission Successful</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #071b33;
        }

        .success-card {
            width: 100%;
            max-width: 520px;
            background: #fff;
            padding: 45px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
        }

        .success-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #0878e8;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        h1 {
            color: #071b33;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .message {
            color: #687789;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .status {
            background: #f1f7ff;
            border: 1px solid #d7e9ff;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 25px;
            color: #17466f;
        }

        .status i {
            color: #0878e8;
            margin-right: 8px;
        }

        .shipping-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 25px 0 30px;
            color: #0878e8;
        }

        .shipping-icons div {
            font-size: 13px;
            font-weight: bold;
        }

        .shipping-icons i {
            display: block;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .return-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            background: #0878e8;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .return-btn:hover {
            background: #0561bd;
        }

        .footer {
            margin-top: 22px;
            color: #8a96a5;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .success-card {
                padding: 35px 22px;
            }

            h1 {
                font-size: 27px;
            }

            .shipping-icons {
                gap: 18px;
            }
        }
    </style>
</head>

<body>

<div class="success-card">

    <div class="success-icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <h1>Submission Successful</h1>

    <p class="message">
        Your information has been received successfully.
        Thank you for providing your details.
    </p>

    <div class="status">
        <i class="fa-solid fa-circle-check"></i>
        Your information has been securely submitted.
    </div>

    <div class="shipping-icons">

        <div>
            <i class="fa-solid fa-box"></i>
            Shipping
        </div>

        <div>
            <i class="fa-solid fa-truck-fast"></i>
            Logistics
        </div>

        <div>
            <i class="fa-solid fa-plane"></i>
            Delivery
        </div>

    </div>

    <a href="/" class="return-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Return to Form
    </a>

    <div class="footer">
        <i class="fa-solid fa-shield-halved"></i>
        Your information is securely processed
    </div>

</div>

</body>
</html>
